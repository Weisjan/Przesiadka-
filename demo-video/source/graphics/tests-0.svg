<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#08080A"/><g font-family="Bahnschrift, Segoe UI, Arial, sans-serif"><text x="130" y="112" font-size="52" fill="#F3F2ED" font-weight="400">Sprawdzone w testach</text><path d="M130 160H1790" stroke="#34343C"/><text x="130" y="210" font-size="27" fill="#B0AFB8" font-weight="400">Rzeczywisty wynik lokalnego uruchomienia</text><text x="150" y="330" font-size="38" fill="#F3F2ED" font-weight="400">Backend / pytest</text><text x="1420" y="330" font-size="46" fill="#ABE58A" font-weight="400">222 PASS</text><path d="M150 370H1770" stroke="#34343C"/><text x="150" y="490" font-size="38" fill="#F3F2ED" font-weight="400">Frontend / Node</text><text x="1420" y="490" font-size="46" fill="#ABE58A" font-weight="400">25 PASS</text><path d="M150 530H1770" stroke="#34343C"/><text x="150" y="650" font-size="38" fill="#F3F2ED" font-weight="400">Przeglądarka / Edge</text><text x="1420" y="650" font-size="46" fill="#ABE58A" font-weight="400">15 PASS</text><path d="M150 690H1770" stroke="#34343C"/><text x="150" y="805" font-size="29" fill="#F3F2ED" font-weight="400">Kalendarze i północ. Zmiana czasu. Stare odpowiedzi. SVG/SMIL.</text><text x="150" y="875" font-size="23" fill="#B0AFB8" font-weight="400">Edge używa syntetycznych odpowiedzi API; demo korzysta z rzeczywistego lokalnego GTFS.</text></g></svg>